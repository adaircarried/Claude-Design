; =============================================================================
;  Brazo robotico RR de 2 GDL - Conecta 4
;  Control de Robots - Parcial 1
; =============================================================================
;  Dos entornos:
;    esp32dev : firmware real sobre ESP32 DevKit V1 (Arduino framework)
;    native   : tests unitarios de cinematica en la PC, SIN hardware
;               -> pio test -e native
; =============================================================================

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; 115200 baudios: debe coincidir con el monitor serial y con config.h
monitor_speed   = 115200
upload_speed    = 921600
monitor_filters = time, colorize

lib_deps =
    ; Generacion de pasos por hardware (RMT/MCPWM del ESP32).
    ; >=0.30 es obligatorio: es la version que expone engine.init(core)
    ; y el parametro dir_change_delay_us de setDirectionPin().
    gin66/FastAccelStepper @ ^0.31.4

build_flags =
    -Wall
    -Wextra
    ; Sube el nivel de log del core de Arduino solo si necesitas depurar arranque.
    ; -DCORE_DEBUG_LEVEL=3

; -----------------------------------------------------------------------------
; Tests nativos: compilan SOLO kinematics.cpp, que no depende de Arduino.
; Esta separacion es deliberada -> ver comentario de cabecera en kinematics.h
; -----------------------------------------------------------------------------
[env:native]
platform       = native
test_framework = unity
build_flags    = -std=c++17 -I src -Wall
build_src_filter = -<*> +<kinematics.cpp>
