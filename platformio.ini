; Péndulo invertido lineal (ESP32 + stepper)
;
; Cada entorno compila solo su carpeta dentro de src/ y reutiliza los módulos de lib/.
;   pio run -e test_encoder -t upload -t monitor
;   pio run -e test_stepper -t upload -t monitor
;   pio run -e main         -t upload -t monitor
;   pio test -e native      (pruebas unitarias en la PC, sin hardware)

[platformio]
default_envs = test_encoder

; Configuración común a los entornos del ESP32
[esp32]
; espressif32 6.x trae Arduino-ESP32 2.0.x (API de timers timerBegin/timerAlarmWrite)
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = -Wall
lib_deps =
    madhephaestus/ESP32Encoder@^0.11.7

[env:test_encoder]
extends = esp32
build_src_filter = +<test_encoder/>

[env:test_stepper]
extends = esp32
build_src_filter = +<test_stepper/>
lib_deps =
    ${esp32.lib_deps}
    gin66/FastAccelStepper@^0.31.3

[env:main]
extends = esp32
build_src_filter = +<main/>
lib_deps =
    ${esp32.lib_deps}
    gin66/FastAccelStepper@^0.31.3

; Pruebas unitarias de la matemática pura (sin Arduino) en la PC
[env:native]
platform = native
build_src_filter = -<*>
lib_compat_mode = off
test_build_src = no
