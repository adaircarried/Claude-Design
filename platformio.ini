; =============================================================================
;  Brazo robotico RR de 2 GDL - Conecta 4
;  Control de Robots - Parcial 1
; =============================================================================
;  Tres entornos:
;    esp32dev    : firmware real del robot sobre ESP32 DevKit V1 (Arduino)
;    bench_motor : PRUEBA DE BANCO del cableado, programa minimo e independiente
;                  (src/bench/bench_motor.cpp). Cargar ANTES que el firmware.
;    native      : tests unitarios en la PC, SIN hardware -> pio test -e native
;
;  Para elegir entorno en VS Code: barra azul de abajo, selector
;  "env:..." , o panel de la hormiga -> Project Tasks -> <entorno>.
; =============================================================================

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; 115200 baudios, 8 bits, paridad PAR, 1 de paro (8E1): debe coincidir con
; config.h y con el pendant. Al reiniciar, el cargador de arranque del ESP32
; imprime a 8N1, asi que las primeras lineas pueden salir con basura: normal.
monitor_speed   = 115200
monitor_parity  = E
upload_speed    = 921600
; time                     : marca de tiempo en cada linea, util para medir
;                            cuanto tarda un movimiento
; esp32_exception_decoder  : si el ESP32 entra en panico (Guru Meditation),
;                            traduce las direcciones del backtrace a
;                            archivo:linea. Sin este filtro solo verias una
;                            lista de numeros hexadecimales inservible.
monitor_filters = time, esp32_exception_decoder

; El programa de banco vive en src/bench/ y tiene su propio setup()/loop():
; se excluye aqui para que no choque con main.cpp al enlazar.
build_src_filter = +<*> -<bench/>

lib_deps =
    ; Generacion de pasos por hardware (RMT/MCPWM del ESP32).
    ; >=0.30 es obligatorio: es la version que expone engine.init(core)
    ; y el parametro dir_change_delay_us de setDirectionPin().
    gin66/FastAccelStepper @ ^0.31.4

build_flags =
    -Wall
    -Wextra
    ; Sube el nivel de log del core de Arduino solo si necesitas depurar arranque.
    ; -DCORE_DEBUG_LEVEL=3

; -----------------------------------------------------------------------------
; Prueba de banco del cableado. No usa librerias: pulsos generados a mano.
; Comandos de una tecla, sin Enter. Monitor 115200 8N1.
; -----------------------------------------------------------------------------
[env:bench_motor]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed   = 115200
upload_speed    = 921600
monitor_filters = time, esp32_exception_decoder
build_src_filter = -<*> +<bench/bench_motor.cpp>
build_flags = -Wall -Wextra

; -----------------------------------------------------------------------------
; Tests nativos: compilan SOLO los modulos que no dependen de Arduino
; (cinematica, CRC y trama). Esta separacion es deliberada: ver los
; comentarios de cabecera de kinematics.h y frame.h.
; -----------------------------------------------------------------------------
[env:native]
platform       = native
test_framework = unity
build_flags    = -std=c++17 -I src -Wall
build_src_filter = -<*> +<kinematics.cpp> +<crc16.cpp> +<frame.cpp>
